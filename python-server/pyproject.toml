[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcgis-mcp-server"
version = "0.4.3"
description = "Model Context Protocol server bridge for ArcGIS Pro 3.7."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marco Gonzalez Valdiviezo" },
]
keywords = ["arcgis", "arcgis-pro", "mcp", "model-context-protocol", "gis", "geoprocessing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp>=1.28.1,<2",
    "pywin32>=312",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/marcovgonzalezv/arcgis-mcp"
Repository = "https://github.com/marcovgonzalezv/arcgis-mcp"

[project.scripts]
arcgis-mcp-server = "arcgis_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arcgis_mcp*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
